<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Spotify Library</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Library">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>
  <div class="rl-grid" id="grid"></div>
  <div id="sentinel"></div>
  <div class="rl-empty" id="empty" hidden></div>

  <nav class="rl-tabbar" id="tabbar">
    <a class="rl-tab" href="#/library" data-tab="library">
      <svg viewBox="0 0 16 16" width="24" height="24" fill="currentColor"><path d="M4.5 6.8l.7-.8C4.1 4.7 2.5 4 .9 4v1c1.3 0 2.6.6 3.5 1.6l.1.2zm7.5 4.7c-1.2 0-2.3-.5-3.2-1.3l-.6.8c1 1 2.4 1.5 3.8 1.5V14l3.5-2-3.5-2v1.5zm0-6V7l3.5-2L12 3v1.5c-1.6 0-3.2.7-4.2 2l-3.4 3.9c-.9 1-2.2 1.6-3.5 1.6v1c1.6 0 3.2-.7 4.2-2l3.4-3.9c.9-1 2.2-1.6 3.5-1.6z"/></svg>
      <span>Random Library</span>
    </a>
    <a class="rl-tab" href="#/releases" data-tab="releases">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5v-5z"/></svg>
      <span>Release List</span>
    </a>
  </nav>

  <div class="rl-modal-backdrop" id="pickModal" hidden>
    <div class="rl-modal-card">
      <div class="rl-card-artwork-wrapper" id="pickArt"></div>
      <div class="rl-pick-title" id="pickTitle"></div>
      <div class="rl-pick-artist" id="pickArtist"></div>
      <div class="rl-pick-actions">
        <a class="rl-btn primary" id="pickOpen">Open in Spotify</a>
        <button class="rl-btn" id="pickAgain">Another</button>
      </div>
    </div>
  </div>

  <div class="rl-modal-backdrop" id="settingsModal" hidden>
    <div class="rl-modal-card rl-settings-card" id="settingsCard"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
